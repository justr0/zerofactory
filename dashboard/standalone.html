<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zero Factory</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="bg-slate-950">
  <button id="health-toggle" type="button" style="position:fixed;right:1rem;bottom:1rem;z-index:1000">Health / Reaper</button>
  <aside id="health-panel" hidden style="position:fixed;right:1rem;bottom:4rem;z-index:1000;max-width:32rem;max-height:70vh;overflow:auto;background:#111827;color:#e5e7eb;padding:1rem;border:1px solid #475569;border-radius:.75rem">
    <h2>Dispatcher health</h2><button id="health-refresh" type="button">Refresh status</button>
    <button id="health-reap" type="button">Reap all stuck tasks</button><pre id="health-data"></pre>
  </aside>
  <div id="root"></div>
  <script>
    window.__HERMES_PLUGIN_SDK__ = {
      fetchJSON: async (url, options = {}) => {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || data.error || response.statusText);
        return data;
      },
      utils: {}
    };
    const healthPanel = document.querySelector('#health-panel');
    const healthData = document.querySelector('#health-data');
    const healthRequest = async (path, options = {}) => {
      const response = await fetch('/api/plugins/zerofactory' + path, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || data.error || response.statusText);
      return data;
    };
    const refreshHealth = async () => {
      try {
        const [status, stuck] = await Promise.all([
          healthRequest('/dispatch/status'), healthRequest('/health/stuck-tasks')
        ]);
        healthData.textContent = JSON.stringify({ status, stuck_tasks: stuck }, null, 2);
      } catch (error) { healthData.textContent = error.message; }
    };
    document.querySelector('#health-toggle').addEventListener('click', () => {
      healthPanel.hidden = !healthPanel.hidden;
      if (!healthPanel.hidden) refreshHealth();
    });
    document.querySelector('#health-refresh').addEventListener('click', refreshHealth);
    document.querySelector('#health-reap').addEventListener('click', async () => {
      try {
        healthData.textContent = JSON.stringify(await healthRequest('/health/reap-stuck', { method: 'POST' }), null, 2);
        await refreshHealth();
      } catch (error) { healthData.textContent = error.message; }
    });
  </script>
  <script src="/assets/app.js"></script>
</body>
</html>
